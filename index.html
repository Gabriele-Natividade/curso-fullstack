<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Dado</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f3f4f6; 
            transition: background 0.3s ease;
        }
        
        .card { 
            text-align: center; 
            padding: 30px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 280px;
        }
        
        h1 { 
            font-size: 1.4rem; 
            color: #4b5563; 
            margin-bottom: 20px; 
        }
        
        .display { 
            font-size: 4.5rem; 
            margin-bottom: 25px; 
            font-weight: bold; 
            color: #1f2937; 
            transition: transform 0.2s ease;
        }
        
        button { 
            width: 100%;
            padding: 12px; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            color: white; 
            border-radius: 6px; 
            background-color: #3b82f6;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sortear Dado (1 a 6)</h1>
        <div id="display" class="display">?</div>
        <button onclick="sortear()">Lançar Dado</button>
    </div>

    <script>
        const display = document.getElementById('display');

        function sortear() {
            display.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                const numeroSorteado = Math.floor(Math.random() * 6) + 1;
                
                display.textContent = numeroSorteado;
                display.style.transform = 'scale(1.1)';
                
                if (numeroSorteado === 6) {
                    display.style.color = '#10b981';
                } else if (numeroSorteado === 1) {
                    display.style.color = '#ef4444';
                } else {
                    display.style.color = '#1f2937';
                }
            }, 150);
        }
    </script>
</body>
</html>
