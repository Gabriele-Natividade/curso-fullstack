<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Dungeon - RPG Tático (Floresta Noturna)</title>
    <style>
        :root {
            --bg-color: #040807; 
            --panel-color: #0b1a16; 
            --border-color: #204d41; 
            --text-color: #e6f7f2; 
            --accent-color: #2dd4bf; 
            
            --hp-color: #ff4d4d; 
            --mp-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            display: grid;
            grid-template-columns: 600px 300px;
            gap: 20px;
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(45, 212, 191, 0.1);
        }

        #canvas-wrapper {
            position: relative;
        }

        canvas {
            background-color: #020404;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: block;
        }

        #sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-section {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(45, 212, 191, 0.1);
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(45, 212, 191, 0.5);
        }

        .stat-bar {
            background-color: #1a2e29;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-fill {
            height: 100%;
            transition: width 0.2s ease-out;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        }

        #hp-fill { background-color: var(--hp-color); }
        #mp-fill { background-color: var(--mp-color); }

        .stat-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 20px;
            color: white;
            text-shadow: 1px 1px 2px black;
            left: 0;
            top: 0;
        }

        #log-container {
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 5px;
            color: #a3b3ae;
        }

        #log-container::-webkit-scrollbar {
            width: 4px;
        }
        #log-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .log-entry { padding: 2px 4px; border-radius: 3px; background-color: rgba(0, 0, 0, 0.2); }
        .log-player { color: var(--accent-color); }
        .log-enemy { color: var(--hp-color); }
        .log-system { color: #facc15; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.8rem;
            color: #8da39e;
        }

        kbd {
            background: #1a2e29;
            color: var(--text-color);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="sidebar">
        <div>
            <div class="panel-section">
                <h2>Jogador (Turno)</h2>
                <div>
                    <span>Vida (HP):</span>
                    <div class="stat-bar">
                        <div id="hp-fill" class="stat-fill" style="width: 100%;"></div>
                        <span id="hp-text" class="stat-text">100 / 100</span>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <span>Mana (MP):</span>
                    <div class="stat-bar">
                        <div id="mp-fill" class="stat-fill" style="width: 100%;"></div>
                        <span id="mp-text" class="stat-text">50 / 50</span>
                    </div>
                </div>
                <div style="margin-top: 12px; font-size: 0.9rem;">
                    Status: <strong id="floor-display" style="color: var(--mp-color)">Andar 1</strong>
                </div>
            </div>

            <div class="panel-section">
                <h2>Histórico</h2>
                <div id="log-container"></div>
            </div>
        </div>

        <div class="panel-section" style="margin-bottom: 0;">
            <h2>Comandos</h2>
            <div class="controls-grid">
                <div><kbd>↑</kbd> / <kbd>W</kbd> Norte</div>
                <div><kbd>↓</kbd> / <kbd>S</kbd> Sul</div>
                <div><kbd>←</kbd> / <kbd>A</kbd> Oeste</div>
                <div><kbd>→</kbd> / <kbd>D</kbd> Leste</div>
                <div><kbd>Espaço</kbd> Esperar</div>
                <div><kbd>F</kbd> Magia (15 MP)</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CANVAS = document.getElementById('gameCanvas');
    const CTX = CANVAS.getContext('2d');
    const TILE_SIZE = 40; 
    const GRID_SIZE = 15;

    const COLOR_THEME = {
        black: '#000000',
        wall_vis: '#1a3d34',
        wall_hid: '#0d1f1a',
        floor_vis: '#0d1f1a',
        floor_hid: '#050a09',
        stairs: '#f59e0b',
        player: '#2dd4bf',
        player_eye: '#ffffff',
        enemy_hp_bg: 'rgba(0,0,0,0.7)',
        enemy_hp_fill: '#ff4d4d'
    };

    const TILES = {
        WALL: 0,
        FLOOR: 1,
        STAIRS: 2
    };

    const state = {
        map: [],
        visibleMap: [],
        player: {
            x: 2,
            y: 2,
            hp: 100,
            maxHp: 100,
            mp: 50,
            maxMp: 50,
            atk: 15,
            spellAtk: 35
        },
        enemies: [],
        floor: 1,
        isGameOver: false
    };

    function generateDungeon() {
        state.map = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(TILES.WALL));
        state.visibleMap = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        
        createRoom(1, 1, 4, 4);
        createRoom(8, 2, 5, 4);
        createRoom(2, 9, 5, 5);
        createRoom(9, 9, 5, 4);

        digCorridorHorizontal(3, 1, 9);
        digCorridorVertical(9, 3, 9);
        digCorridorHorizontal(9, 4, 11);
        digCorridorVertical(4, 4, 9);

        state.map[12][11] = TILES.STAIRS;

        state.player.x = 2;
        state.player.y = 2;
        
        spawnEnemies();
        updateFogOfWar();
    }

    function createRoom(x, y, w, h) {
        for (let i = x; i < x + w; i++) {
            for (let j = y; j < y + h; j++) {
                if (i > 0 && i < GRID_SIZE - 1 && j > 0 && j < GRID_SIZE - 1) {
                    state.map[j][i] = TILES.FLOOR;
                }
            }
        }
    }

    function digCorridorHorizontal(y, x1, x2) {
        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
            state.map[y][x] = TILES.FLOOR;
        }
    }

    function digCorridorVertical(x, y1, y2) {
        for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
            state.map[y][x] = TILES.FLOOR;
        }
    }

    function spawnEnemies() {
        state.enemies = [];
        const spawnPoints = [
            {x: 10, y: 3, hp: 40, maxHp: 40, name: "Cobra", color: "#4ade80"},
            {x: 4, y: 11, hp: 60, maxHp: 60, name: "Aranha", color: "#a78bfa"},
            {x: 11, y: 11, hp: 35, maxHp: 35, name: "Sombra", color: "#94a3b8"}
        ];

        spawnPoints.forEach(ep => {
            state.enemies.push({
                x: ep.x,
                y: ep.y,
                hp: ep.hp + (state.floor * 5),
                maxHp: ep.maxHp + (state.floor * 5),
                atk: 8 + (state.floor * 2),
                name: `${ep.name} Nv.${state.floor}`,
                color: ep.color
            });
        });
    }

    function updateFogOfWar() {
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                if (state.visibleMap[y][x] === 2) state.visibleMap[y][x] = 1;
            }
        }

        const radius = 4;
        for (let dY = -radius; dY <= radius; dY++) {
            for (let dX = -radius; dX <= radius; dX++) {
                if (dX*dX + dY*dY <= radius*radius) {
                    const targetX = state.player.x + dX;
                    const targetY = state.player.y + dY;

                    if (targetX >= 0 && targetX < GRID_SIZE && targetY >= 0 && targetY < GRID_SIZE) {
                        state.visibleMap[targetY][targetX] = 2;
                    }
                }
            }
        }
    }

    function handlePlayerMove(dx, dy) {
        if (state.isGameOver) return;

        const targetX = state.player.x + dx;
        const targetY = state.player.y + dy;

        if (state.map[targetY][targetX] === TILES.WALL) return;

        const enemy = state.enemies.find(e => e.x === targetX && e.y === targetY);
        if (enemy) {
            executeAttack(state.player, enemy);
            if (!state.isGameOver) processEnemyTurn();
            return;
        }

        state.player.x = targetX;
        state.player.y = targetY;

        if (state.map[state.player.y][state.player.x] === TILES.STAIRS) {
            state.floor++;
            addLog(`Você desceu para o Andar ${state.floor}!`, 'system');
            document.getElementById('floor-display').innerText = `Andar ${state.floor}`;
            generateDungeon();
            updateUI();
            render();
            return;
        }

        if (state.player.mp < state.player.maxMp) state.player.mp = Math.min(state.player.maxMp, state.player.mp + 1);

        updateFogOfWar();
        processEnemyTurn();
    }

    function castSpell() {
        if (state.isGameOver) return;

        if (state.player.mp < 15) {
            addLog("Mana insuficiente!", "system");
            return;
        }

        const target = state.enemies.find(e => state.visibleMap[e.y][e.x] === 2);
        
        if (!target) {
            addLog("Nenhum inimigo visível para alvejar a magia.", "system");
            return;
        }

        state.player.mp -= 15;
        addLog(`Você lançou Raio Solar em ${target.name}!`, 'player');
        
        target.hp -= state.player.spellAtk;
        if (target.hp <= 0) {
            addLog(`O raio obliterou o ${target.name}!`, 'player');
            state.enemies = state.enemies.filter(e => e !== target);
        }

        processEnemyTurn();
    }

    function executeAttack(attacker, target) {
        if (state.isGameOver) return;

        const damage = Math.floor(attacker.atk * (0.8 + Math.random() * 0.4));
        target.hp -= damage;
        
        if (attacker === state.player) {
            addLog(`Você atacou ${target.name} e causou ${damage} de dano!`, 'player');
            if (target.hp <= 0) {
                addLog(`Você derrotou ${target.name}!`, 'player');
                state.enemies = state.enemies.filter(e => e !== target);
            }
        } else {
            addLog(`${attacker.name} atacou você e causou ${damage} de dano!`, 'enemy');
            if (target.hp <= 0) {
                target.hp = 0;
                state.isGameOver = true;
                addLog(`Você sucumbiu à floresta. Fim de jogo!`, 'enemy');
                updateUI();
                render();
                setTimeout(() => {
                    alert("Game Over! O jogo será reiniciado.");
                    resetGame();
                }, 10);
            }
        }
    }

    function processEnemyTurn() {
        if (state.isGameOver) return;

        for (let i = 0; i < state.enemies.length; i++) {
            if (state.isGameOver) break;

            const enemy = state.enemies[i];
            const distanceX = state.player.x - enemy.x;
            const distanceY = state.player.y - enemy.y;
            const distance = Math.abs(distanceX) + Math.abs(distanceY); 

            if (distance <= 1) {
                executeAttack(enemy, state.player);
            } 
            else if (state.visibleMap[enemy.y][enemy.x] === 2) {
                let nextDx = Math.sign(distanceX);
                let nextDy = Math.sign(distanceY);

                if (Math.abs(distanceX) >= Math.abs(distanceY)) {
                    if (state.map[enemy.y][enemy.x + nextDx] !== TILES.WALL && !isEnemyAt(enemy.x + nextDx, enemy.y)) {
                        enemy.x += nextDx;
                    } else if (state.map[enemy.y + nextDy][enemy.x] !== TILES.WALL && !isEnemyAt(enemy.x, enemy.y + nextDy)) {
                        enemy.y += nextDy;
                    }
                } else {
                    if (state.map[enemy.y + nextDy][enemy.x] !== TILES.WALL && !isEnemyAt(enemy.x, enemy.y + nextDy)) {
                        enemy.y += nextDy;
                    } else if (state.map[enemy.y][enemy.x + nextDx] !== TILES.WALL && !isEnemyAt(enemy.x + nextDx, enemy.y)) {
                        enemy.x += nextDx;
                    }
                }
            }
        }

        updateUI();
        render();
    }

    function isEnemyAt(x, y) {
        return state.enemies.some(e => e.x === x && e.y === y);
    }

    function render() {
        CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const visibility = state.visibleMap[y][x];
                
                if (visibility === 0) {
                    CTX.fillStyle = COLOR_THEME.black;
                    CTX.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    continue;
                }

                if (state.map[y][x] === TILES.WALL) {
                    CTX.fillStyle = visibility === 2 ? COLOR_THEME.wall_vis : COLOR_THEME.wall_hid;
                } else if (state.map[y][x] === TILES.STAIRS) {
                    CTX.fillStyle = COLOR_THEME.stairs;
                } else {
                    CTX.fillStyle = visibility === 2 ? COLOR_THEME.floor_vis : COLOR_THEME.floor_hid;
                }
                
                CTX.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                
                CTX.strokeStyle = 'rgba(45, 212, 191, 0.03)';
                CTX.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }

        state.enemies.forEach(enemy => {
            if (state.visibleMap[enemy.y][enemy.x] === 2) {
                CTX.fillStyle = enemy.color;
                CTX.beginPath();
                CTX.arc(enemy.x * TILE_SIZE + TILE_SIZE/2, enemy.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2.5, 0, Math.PI * 2);
                CTX.fill();

                const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);
                CTX.fillStyle = COLOR_THEME.enemy_hp_bg;
                CTX.fillRect(enemy.x * TILE_SIZE + 4, enemy.y * TILE_SIZE + 4, TILE_SIZE - 8, 4);
                CTX.fillStyle = COLOR_THEME.enemy_hp_fill;
                CTX.fillRect(enemy.x * TILE_SIZE + 4, enemy.y * TILE_SIZE + 4, (TILE_SIZE - 8) * hpPercent, 4);
            }
        });

        if (!state.isGameOver) {
            CTX.fillStyle = COLOR_THEME.player; 
            CTX.beginPath();
            CTX.arc(state.player.x * TILE_SIZE + TILE_SIZE/2, state.player.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2.2, 0, Math.PI * 2);
            CTX.fill();
            
            CTX.fillStyle = COLOR_THEME.player_eye;
            CTX.beginPath();
            CTX.arc(state.player.x * TILE_SIZE + TILE_SIZE/2 - 3, state.player.y * TILE_SIZE + TILE_SIZE/2 - 3, 3, 0, Math.PI * 2);
            CTX.fill();
        }
    }

    function updateUI() {
        const hpPercent = Math.max(0, (state.player.hp / state.player.maxHp) * 100);
        const mpPercent = Math.max(0, (state.player.mp / state.player.maxMp) * 100);

        document.getElementById('hp-fill').style.width = `${hpPercent}%`;
        document.getElementById('hp-text').innerText = `${state.player.hp} / ${state.player.maxHp}`;

        document.getElementById('mp-fill').style.width = `${mpPercent}%`;
        document.getElementById('mp-text').innerText = `${state.player.mp} / ${state.player.maxMp}`;
    }

    function addLog(text, type) {
        const container = document.getElementById('log-container');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.innerText = `> ${text}`;
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
    }

    function resetGame() {
        state.player.hp = state.player.maxHp;
        state.player.mp = state.player.maxMp;
        state.floor = 1;
        state.isGameOver = false;
        document.getElementById('log-container').innerHTML = '';
        document.getElementById('floor-display').innerText = `Andar 1`;
        addLog("Você entrou na floresta sussurrante...", "system");
        generateDungeon();
        updateUI();
        render();
    }

    window.addEventListener('keydown', e => {
        if (state.isGameOver) return;
        
        switch(e.key.toLowerCase()) {
            case 'arrowup':
            case 'w':
                handlePlayerMove(0, -1);
                break;
            case 'arrowdown':
            case 's':
                handlePlayerMove(0, 1);
                break;
            case 'arrowleft':
            case 'a':
                handlePlayerMove(-1, 0);
                break;
            case 'arrowright':
            case 'd':
                handlePlayerMove(1, 0);
                break;
            case ' ':
                e.preventDefault(); 
                addLog("Você aguardou um momento.", "system");
                processEnemyTurn();
                break;
            case 'f':
                castSpell();
                break;
        }
    });

    resetGame();
</script>

</body>
</html>
