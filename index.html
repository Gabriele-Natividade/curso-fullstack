<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake Pro</title>
    <style>
        body { 
            background: #080b10; 
            color: #f0f6fc; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-container {
            margin-bottom: 5px;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 5px 0;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }
        .placar-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #pontuacao { color: #00e5ff; text-shadow: 0 0 5px rgba(0, 229, 255, 0.4); }
        #recorde { color: #ff3366; text-shadow: 0 0 5px rgba(255, 51, 102, 0.4); }
        .canvas-area {
            position: relative;
            margin-bottom: 15px;
        }
        canvas { 
            background: #11161d; 
            border: 3px solid #1f242c; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 136, 0.15);
            display: block; 
            max-width: 100%;
            height: auto;
        }
        .controles-container {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 10px;
        }
        .btn-controle {
            background: #161b22;
            border: 2px solid #30363d;
            color: #00ff88;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background 0.1s, border-color 0.1s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-controle:active {
            transform: scale(0.92);
            background: #00ff88;
            color: #080b10;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }
        #btnUp { grid-column: 2; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }
        #btnReiniciar { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 30px; 
            background: linear-gradient(45deg, #00ff88, #00e5ff); 
            color: #080b10; 
            border: none; 
            border-radius: 30px;
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.5);
            display: none;
            z-index: 10;
        }
        #btnReiniciar:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 229, 255, 0.7);
        }
        @media(min-width: 768px) {
            .controles-container {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🐍 CYBER SNAKE</h1>
        <div class="placar-container">
            <span id="pontuacao">SCORE: 0</span>
            <span id="recorde">HIGH: 0</span>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="btnReiniciar" onclick="inicializar()">Jogar Novamente</button>
    </div>

    <div class="controles-container">
        <button class="btn-controle" id="btnUp">↑</button>
        <button class="btn-controle" id="btnLeft">←</button>
        <button class="btn-controle" id="btnRight">→</button>
        <button class="btn-controle" id="btnDown">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tam = 20;
        
        let cobra, dx, dy, comidaX, comidaY, pontuacao, jogoRodando;
        let mudarDirecao = false; 
        let jogoTimeout; 
        let velocidade = 120;
        let recorde = localStorage.getItem("snakeHighScore") || 0;

        document.getElementById("recorde").innerText = `HIGH: ${recorde}`;

        function inicializar() {
            if (jogoTimeout) clearTimeout(jogoTimeout);

            cobra = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = tam; 
            dy = 0; 
            pontuacao = 0; 
            velocidade = 120;
            jogoRodando = true;
            mudarDirecao = false;

            document.getElementById("btnReiniciar").style.display = "none";
            document.getElementById("pontuacao").innerText = "SCORE: 0";
            
            gerarComida();
            atualizarJogo();
        }

        function gerarComida() {
            comidaX = Math.floor(Math.random() * (canvas.width / tam)) * tam;
            comidaY = Math.floor(Math.random() * (canvas.height / tam)) * tam;
            if (cobra.some(p => p.x === comidaX && p.y === comidaY)) gerarComida();
        }

        function atualizarJogo() {
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(8, 11, 16, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366"; 
                ctx.font = "bold 32px system-ui, sans-serif"; 
                ctx.textAlign = "center";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 15;
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2);
                
                ctx.shadowBlur = 0; 
                document.getElementById("btnReiniciar").style.display = "inline-block";
                return;
            }

            jogoTimeout = setTimeout(() => {
                mudarDirecao = false; 
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const cabeca = { x: cobra[0].x + dx, y: cobra[0].y + dy };
                
                if (cabeca.x < 0) cabeca.x = canvas.width - tam;
                if (cabeca.x >= canvas.width) cabeca.x = 0;
                if (cabeca.y < 0) cabeca.y = canvas.height - tam;
                if (cabeca.y >= canvas.height) cabeca.y = 0;

                const colidiuCorpo = cobra.some(p => p.x === cabeca.x && p.y === cabeca.y);
                if (colidiuCorpo) {
                    jogoRodando = false;
                    atualizarJogo();
                    return;
                }

                cobra.unshift(cabeca);

                if (cabeca.x === comidaX && cabeca.y === comidaY) {
                    pontuacao += 10;
                    document.getElementById("pontuacao").innerText = `SCORE: ${pontuacao}`;
                    
                    if (pontuacao > recorde) {
                        recorde = pontuacao;
                        localStorage.setItem("snakeHighScore", recorde);
                        document.getElementById("recorde").innerText = `HIGH: ${recorde}`;
                    }

                    if (velocidade > 50) velocidade -= 3;
                    gerarComida();
                } else {
                    cobra.pop();
                }

                ctx.fillStyle = "#ff3366";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 10;
                ctx.fillRect(comidaX + 3, comidaY + 3, tam - 6, tam - 6);

                cobra.forEach((p, index) => {
                    if (index === 0) {
                        ctx.fillStyle = "#00e5ff"; 
                        ctx.shadowColor = "#00e5ff";
                    } else {
                        ctx.fillStyle = "#00ff88"; 
                        ctx.shadowColor = "#00ff88";
                    }
                    ctx.shadowBlur = 6;
                    ctx.fillRect(p.x + 1, p.y + 1, tam - 2, tam - 2);
                });
                
                ctx.shadowBlur = 0; 
                atualizarJogo();
            }, velocidade);
        }

        function mudarDirecaoPara(novaTecla) {
            if (mudarDirecao) return;

            if (novaTecla === "ArrowUp" && dy === 0) { dx = 0; dy = -tam; mudarDirecao = true; }
            if (novaTecla === "ArrowDown" && dy === 0) { dx = 0; dy = tam; mudarDirecao = true; }
            if (novaTecla === "ArrowLeft" && dx === 0) { dx = -tam; dy = 0; mudarDirecao = true; }
            if (novaTecla === "ArrowRight" && dx === 0) { dx = tam; dy = 0; mudarDirecao = true; }
        }

        window.addEventListener("keydown", e => mudarDirecaoPara(e.key));

        document.getElementById("btnUp").addEventListener("click", () => mudarDirecaoPara("ArrowUp"));
        document.getElementById("btnDown").addEventListener("click", () => mudarDirecaoPara("ArrowDown"));
        document.getElementById("btnLeft").addEventListener("click", () => mudarDirecaoPara("ArrowLeft"));
        document.getElementById("btnRight").addEventListener("click", () => mudarDirecaoPara("ArrowRight"));

        inicializar();
    </script>
</body>
</html>
