<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTracker | Gerenciador de Tarefas</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --text-support: #8d8d99;
            --primary: #00b37e;
            --primary-hover: #00875f;
            --danger: #f75a68;
            --border: #323238;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-support);
            font-size: 0.9rem;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .stat-item span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-support);
        }

        .stat-item strong {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background: var(--primary-hover);
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: transform 0.2s, opacity 0.2s, background 0.2s;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-support);
        }

        .btn-toggle-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            flex: 1;
            background: transparent;
            border: none;
            text-align: left;
            color: inherit;
        }

        .btn-toggle-status:focus-visible {
            outline: 1px solid var(--primary);
            outline-offset: 4px;
            border-radius: 4px;
        }
