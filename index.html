<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Simplificado</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f8fafc;
            color: #0f172a;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 1.5rem;
        }

        main {
            flex: 1;
            padding: 2rem;
        }

        .cartao {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto; /* Centraliza horizontalmente */
        }

        .cartao h2 { color: #2563eb; }
        
        .cartao p { color: #475569; margin-bottom: 1.5rem; }

        .botao {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
        }

        footer {
            background-color: #e2e8f0;
            color: #64748b;
            padding: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-vindo</h1>
    </header>

    <main>
        <section class="cartao">
            <h2>Olá, Mundo!</h2>
            <p>Este é um projeto mais limpo, com CSS direto e sem variáveis, mantendo a estrutura visual.</p>
            <a href="#" class="botao">Saiba Mais</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto Simples.</p>
    </footer>

</body>
</html>
