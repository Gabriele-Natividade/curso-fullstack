<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Cobrinha Simplificado</title>
    <style>
        body { background: #2c3e50; color: white; font-family: sans-serif; text-align: center; }
        canvas { background: #34495e; border: 2px solid white; display: block; margin: 20px auto; }
        #btnReiniciar { padding: 10px 20px; background: #2ecc71; color: white; border: none; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>
    <h2 id="pontuacao">Pontuação: 0</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="btnReiniciar" onclick="inicializar()" style="display:none">Jogar Novamente</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tam = 20; // Tamanho de cada bloco do grid
        let cobra, dx, dy, comidaX, comidaY, pontuacao, jogoRodando;

        function inicializar() {
            cobra = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = tam; dy = 0; pontuacao = 0; jogoRodando = true;
            document.getElementById("btnReiniciar").style.display = "none";
            document.getElementById("pontuacao").innerText = "Pontuação: 0";
            gerarComida();
            atualizarJogo();
        }

        function gerarComida() {
            comidaX = Math.floor(Math.random() * (canvas.width / tam)) * tam;
            comidaY = Math.floor(Math.random() * (canvas.height / tam)) * tam;
            if (cobra.some(p => p.x === comidaX && p.y === comidaY)) gerarComida();
        }

        function atualizarJogo() {
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "30px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("Fim de Jogo!", canvas.width / 2, canvas.height / 2);
                document.getElementById("btnReiniciar").style.display = "inline-block";
                return;
            }

            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Mover Cobra
                const cabeca = { x: cobra[0].x + dx, y: cobra[0].y + dy };
                cobra.unshift(cabeca);

                // Comer Comida ou Andar
                if (cabeca.x === comidaX && cabeca.y === comidaY) {
                    pontuacao += 10;
                    document.getElementById("pontuacao").innerText = `Pontuação: ${pontuacao}`;
                    gerarComida();
                } else {
                    cobra.pop();
                }

                // Verificar Colisões (Paredes ou Corpo)
                if (cabeca.x < 0 || cabeca.x >= canvas.width || cabeca.y < 0 || cabeca.y >= canvas.height ||
                    cobra.slice(1).some(p => p.x === cabeca.x && p.y === cabeca.y)) {
                    jogoRodando = false;
                }

                // Desenhar Comida
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(comidaX, comidaY, tam, tam);

                // Desenhar Cobra
                cobra.forEach((p, i) => {
                    ctx.fillStyle = i === 0 ? "#1abc9c" : "#2ecc71";
                    ctx.fillRect(p.x, p.y, tam, tam);
                });

                atualizarJogo();
            }, 100);
        }

        window.addEventListener("keydown", e => {
            if (e.keyCode === 37 && dx === 0) { dx = -tam; dy = 0; } // Esquerda
            if (e.keyCode === 38 && dy === 0) { dx = 0; dy = -tam; } // Cima
            if (e.keyCode === 39 && dx === 0) { dx = tam; dy = 0; }  // Direita
            if (e.keyCode === 40 && dy === 0) { dx = 0; dy = tam; }  // Baixo
        });

        inicializar();
    </script>
</body>
</html>
