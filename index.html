<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Simples</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #e0eafc; 
        }
        
        .card { 
            text-align: center; 
            padding: 30px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        
        h1 { 
            font-size: 1.5rem; 
            color: #333; 
            margin-bottom: 20px; 
        }
        
        .display { 
            font-size: 4rem; 
            margin-bottom: 20px; 
            font-weight: bold; 
            color: #2c3e50; 
        }
        
        .button-group { 
            display: flex; 
            gap: 10px; 
        }
        
        button { 
            padding: 10px 20px; 
            font-size: 1rem; 
            cursor: pointer; 
            border: none; 
            color: white; 
            border-radius: 5px; 
        }
        
        .btn-sub { background-color: #e74c3c; }
        .btn-reset { background-color: #7f8c8d; }
        .btn-add { background-color: #2ecc71; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Contador</h1>
        <div id="display" class="display">0</div>
        
        <div class="button-group">
            <button class="btn-sub" onclick="diminuir()">- Diminuir</button>
            <button class="btn-reset" onclick="zerar()">Zerar</button>
            <button class="btn-add" onclick="somar()">+ Somar</button>
        </div>
    </div>

    <script>
        let numero = 0;
        
        const display = document.getElementById('display');

        function atualizarCor() {
            if (numero > 0) {
                display.style.color = '#2ecc71'; // Verde se for positivo
            } else if (numero < 0) {
                display.style.color = '#e74c3c'; // Vermelho se for negativo
            } else {
                display.style.color = '#2c3e50'; // Cor padrão se for zero
            }
        }

        function somar() {
            numero = numero + 1;
            display.textContent = numero;
            atualizarCor(); // <-- Linha adicionada aqui
        }

        function disminuir() {
            numero = numero - 1;
            display.textContent = numero;
            atualizarCor(); // <-- Linha adicionada aqui
        }

        function zerar() {
            numero = 0;
            display.textContent = numero;
            atualizarCor(); // <-- Linha adicionada aqui
        }
    </script>
</body>
</html>
