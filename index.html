<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha Neon</title>
    <style>
        body { 
            background: #0d1117; 
            color: #f0f6fc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 10px;
        }
        #pontuacao {
            font-size: 1.5rem;
            color: #00e5ff;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
            margin-top: 0;
        }
        canvas { 
            background: #161b22; 
            border: 4px solid #30363d; 
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 136, 0.2);
            display: block; 
            margin: 20px auto; 
        }
        #btnReiniciar { 
            padding: 12px 28px; 
            background: linear-gradient(45deg, #00ff88, #00e5ff); 
            color: #0d1117; 
            border: none; 
            border-radius: 25px;
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #btnReiniciar:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
        }
    </style>
</head>
<body>

    <h1>🐍 Cyber Snake</h1>
    <h2 id="pontuacao">SCORE: 0</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="btnReiniciar" onclick="inicializar()" style="display:none">Jogar Novamente</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tam = 20;
        
        let cobra, dx, dy, comidaX, comidaY, pontuacao, jogoRodando;
        let mudarDirecao = false; 
        let jogoTimeout; 

        function inicializar() {
            if (jogoTimeout) clearTimeout(jogoTimeout);

            cobra = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = tam; 
            dy = 0; 
            pontuacao = 0; 
            jogoRodando = true;
            mudarDirecao = false;

            document.getElementById("btnReiniciar").style.display = "none";
            document.getElementById("pontuacao").innerText = "SCORE: 0";
            
            gerarComida();
            atualizarJogo();
        }

        function gerarComida() {
            comidaX = Math.floor(Math.random() * (canvas.width / tam)) * tam;
            comidaY = Math.floor(Math.random() * (canvas.height / tam)) * tam;
           
            if (cobra.some(p => p.x === comidaX && p.y === comidaY)) gerarComida();
        }

        function atualizarJogo() {
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(13, 17, 23, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366"; 
                ctx.font = "bold 35px sans-serif"; 
                ctx.textAlign = "center";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 10;
                ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2);
                
                ctx.shadowBlur = 0; 
                document.getElementById("btnReiniciar").style.display = "inline-block";
                return;
            }

            jogoTimeout = setTimeout(() => {
                mudarDirecao = false; 
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const cabeca = { x: cobra[0].x + dx, y: cobra[0].y + dy };
                
                if (cabeca.x < 0) cabeca.x = canvas.width - tam;
                if (cabeca.x >= canvas.width) cabeca.x = 0;
                if (cabeca.y < 0) cabeca.y = canvas.height - tam;
                if (cabeca.y >= canvas.height) cabeca.y = 0;

                const colidiuCorpo = cobra.some(p => p.x === cabeca.x && p.y === cabeca.y);
                if (colidiuCorpo) {
                    jogoRodando = false;
                    atualizarJogo();
                    return;
                }

                cobra.unshift(cabeca);

                if (cabeca.x === comidaX && cabeca.y === comidaY) {
                    pontuacao += 20;
                    document.getElementById("pontuacao").innerText = `SCORE: ${pontuacao}`;
                    gerarComida();
                } else {
                    cobra.pop();
                }

                ctx.fillStyle = "#ff3366";
                ctx.shadowColor = "#ff3366";
                ctx.shadowBlur = 8;
                ctx.fillRect(comidaX + 2, comidaY + 2, tam - 4, tam - 4);

                cobra.forEach((p, index) => {
                    if (index === 0) {
                        ctx.fillStyle = "#00e5ff"; 
                        ctx.shadowColor = "#00e5ff";
                    } else {
                        ctx.fillStyle = "#00ff88"; 
                        ctx.shadowColor = "#00ff88";
                    }
                    ctx.shadowBlur = 4;
                    ctx.fillRect(p.x + 1, p.y + 1, tam - 2, tam - 2);
                });
                
                ctx.shadowBlur = 0; 

                atualizarJogo();
            }, 100);
        }

        window.addEventListener("keydown", e => {
            if (mudarDirecao) return;

            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -tam; mudarDirecao = true; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = tam; mudarDirecao = true; }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -tam; dy = 0; mudarDirecao = true; }
            if (e.key === "ArrowRight" && dx === 0) { dx = tam; dy = 0; mudarDirecao = true; }
        });

        inicializar();
    </script>
</body>
</html>
