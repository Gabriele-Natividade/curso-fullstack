<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pong Premium</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        canvas { border: 4px solid #334; background: #000; margin-top: 20px; box-shadow: 0 0 20px rgba(0,254,255,0.1); }
        h2 { font-size: 32px; margin: 15px 0 0 0; letter-spacing: 4px; }
    </style>
</head>
<body>
    <h2><span id="p1" style="color:#00ffcc">0</span> : <span id="p2" style="color:#ff0055">0</span></h2>
    <canvas id="c" width="800" height="500"></canvas>
    <p style="color:#667">Controle: Setas ↑ e ↓</p>

    <script>
        const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
        const p1S = document.getElementById("p1"), p2S = document.getElementById("p2");
        
        let p1Y = 200, p2Y = 200, p1Score = 0, p2Score = 0;
        let bX = 400, bY = 250, bDX = 5, bDY = 3;
        let keys = {};

        document.addEventListener("keydown", e => keys[e.key] = true);
        document.addEventListener("keyup", e => keys[e.key] = false);

        function reset() { bX = 400; bY = 250; bDX = bDX > 0 ? -5 : 5; bDY = (Math.random() - 0.5) * 6; }

        function loop() {
            if (keys["ArrowUp"]) p1Y = Math.max(0, p1Y - 7);
            if (keys["ArrowDown"]) p1Y = Math.min(400, p1Y + 7);
            
            p2Y += (bY - 50 - p2Y) * 0.12;
            p2Y = Math.max(0, Math.min(400, p2Y));

            bX += bDX; bY += bDY;

            if (bY < 10 || bY > 490) bDY = -bDY;

            if (bDX < 0 && bX < 25 && bY > p1Y && bY < p1Y + 100) {
                bDX = -bDX * 1.05;
                bDY = (bY - (p1Y + 50)) * 0.15;
            }
            if (bDX > 0 && bX > 775 && bY > p2Y && bY < p2Y + 100) {
                bDX = -bDX * 1.05;
                bDY = (bY - (p2Y + 50)) * 0.15;
            }

            if (bX < 0) { p2Score++; p2S.innerText = p2Score; reset(); }
            if (bX > 800) { p1Score++; p1S.innerText = p1Score; reset(); }

            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.fillRect(0, 0, 800, 500);

            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(10, p1Y, 10, 100);

            ctx.fillStyle = "#ff0055";
            ctx.fillRect(780, p2Y, 10, 100);

            ctx.fillStyle = "#fff";
            ctx.fillRect(bX - 6, bY - 6, 12, 12);

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
