<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha Pro</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 30px;
        }
        canvas {
            background-color: #34495e;
            border: 3px solid #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #pontuacao { 
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f1c40f;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        p {
            color: #bdc3c7;
            margin-top: 15px;
            font-size: 14px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            display: none; /* Escondido por padrão, aparece no Game Over */
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>
    <div id="pontuacao">Pontuação: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="btnReiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    <p>Use as <b>setas do teclado</b> para jogar.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const btnReiniciar = document.getElementById("btnReiniciar");

        const tamanhoGrid = 20;
        let cobrinha, dx, dy, comidaX, comidaY, pontuacao, jogoRodando;
        let mudouDirecaoNesseTurno = false; // Trava para evitar colisão por clique duplo rápido

        function inicializar() {
            cobrinha = [
                { x: 160, y: 160 },
                { x: 140, y: 160 },
                { x: 120, y: 160 }
            ];
            dx = tamanhoGrid;
            dy = 0;
            pontuacao = 0;
            jogoRodando = true;
            mudouDirecaoNesseTurno = false;
            document.getElementById("pontuacao").innerText = `Pontuação: ${pontuacao}`;
            btnReiniciar.style.display = "none";
            gerarComida();
            atualizarJogo();
        }

        function gerarComida() {
            comidaX = Math.floor(Math.random() * (canvas.width / tamanhoGrid)) * tamanhoGrid;
            comidaY = Math.floor(Math.random() * (canvas.height / tamanhoGrid)) * tamanhoGrid;
            
            // Garante que a comida não vai nascer em cima da cobra
            cobrinha.forEach(parte => {
                if (parte.x === comidaX && parte.y === comidaY) gerarComida();
            });
        }

        function desenharComida() {
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc(comidaX + tamanhoGrid/2, comidaY + tamanhoGrid/2, tamanhoGrid/2.2, 0, 2 * Math.PI);
            ctx.fill();
        }

        function desenharCobrinha() {
            cobrinha.forEach((parte, index) => {
                // A cabeça (index 0) ganha uma cor levemente diferente
                ctx.fillStyle = index === 0 ? "#1abc9c" : "#2ecc71"; 
                ctx.strokeStyle = "#27ae60"; 
                
                ctx.fillRect(parte.x, parte.y, tamanhoGrid, tamanhoGrid);
                ctx.strokeRect(parte.x, parte.y, tamanhoGrid, tamanhoGrid);
            });
        }

        function moverCobrinha() {
            const cabeca = { x: cobrinha[0].x + dx, y: cobrinha[0].y + dy };
            cobrinha.unshift(cabeca); 

            if (cabeca.x === comidaX && cabeca.y === comidaY) {
                pontuacao += 10;
                document.getElementById("pontuacao").innerText = `Pontuação: ${pontuacao}`;
                gerarComida();
            } else {
                cobrinha.pop(); 
            }
        }

        function verificarColisao() {
            const cabeca = cobrinha[0];
            
            // Colisão com as bordas
            if (cabeca.x < 0 || cabeca.x >= canvas.width || cabeca.y < 0 || cabeca.y >= canvas.height) {
                jogoRodando = false;
            }

            // Colisão com o próprio corpo
            for (let i = 1; i < cobrinha.length; i++) {
                if (cabeca.x === cobrinha[i].x && cabeca.y === cobrinha[i].y) {
                    jogoRodando = false;
                }
            }
        }

        function mudarDirecao(evento) {
            
            if (mudouDirecaoNesseTurno) return;

            const TECLA_ESQUERDA = 37;
            const TECLA_DIREITA = 39;
            const TECLA_CIMA = 38;
            const TECLA_BAIXO = 40;

            const teclaPressionada = evento.keyCode;
            const indoCima = dy === -tamanhoGrid;
            const indoBaixo = dy === tamanhoGrid;
            const indoDireita = dx === tamanhoGrid;
            const indoEsquerda = dx === -tamanhoGrid;

            if (teclaPressionada === TECLA_ESQUERDA && !indoDireita) {
                dx = -tamanhoGrid; dy = 0; mudouDirecaoNesseTurno = true;
            }
            if (teclaPressionada === TECLA_CIMA && !indoBaixo) {
                dx = 0; dy = -tamanhoGrid; mudouDirecaoNesseTurno = true;
            }
            if (teclaPressionada === TECLA_DIREITA && !indoEsquerda) {
                dx = tamanhoGrid; dy = 0; mudouDirecaoNesseTurno = true;
            }
            if (teclaPressionada === TECLA_BAIXO && !indoCima) {
                dx = 0; dy = tamanhoGrid; mudouDirecaoNesseTurno = true;
            }
        }

        function atualizarJogo() {
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "bold 35px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Fim de Jogo!", canvas.width / 2, canvas.height / 2 - 10);
                
                btnReiniciar.style.display = "block"; 
                return;
            }

            setTimeout(function onTick() {
                mudouDirecaoNesseTurno = false; 
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                desenharComida();
                moverCobrinha();
                verificarColisao();
                desenharCobrinha();
                atualizarJogo(); 
            }, 100); 
        }

        function reiniciarJogo() {
            inicializar();
        }

        
        document.addEventListener("keydown", mudarDirecao);
        inicializar();
    </script>
</body>
</html>
