<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pong Curto</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        canvas { border: 4px solid #fff; background: #000; margin-top: 20px; }
    </style>
</head>
<body>
    <h2><span id="p1">0</span> : <span id="p2">0</span></h2>
    <canvas id="c" width="800" height="500"></canvas>
    <p>Use as setas ↑ e ↓</p>

    <script>
        const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
        const p1S = document.getElementById("p1"), p2S = document.getElementById("p2");
        
        let p1Y = 200, p2Y = 200, p1Score = 0, p2Score = 0, dy = 0;
        let bX = 400, bY = 250, bDX = 5, bDY = 5;

        document.addEventListener("keydown", e => dy = e.key === "ArrowUp" ? -7 : e.key === "ArrowDown" ? 7 : 0);
        document.addEventListener("keyup", () => dy = 0);

        function reset() { bX = 400; bY = 250; bDX = -bDX; }

        function loop() {
            // Movimento Jogador
            p1Y = Math.max(0, Math.min(400, p1Y + dy));
            // IA do Bot
            p2Y += (bY - 50 - p2Y) * 0.1;
            p2Y = Math.max(0, Math.min(400, p2Y));

            // Movimento Bola
            bX += bDX; bY += bDY;

            // Colisão Paredes
            if (bY < 10 || bY > 490) bDY = -bDY;

            // Colisão Raquetes
            if (bDX < 0 && bX < 25 && bY > p1Y && bY < p1Y + 100) bDX = -bDX * 1.05;
            if (bDX > 0 && bX > 775 && bY > p2Y && bY < p2Y + 100) bDX = -bDX * 1.05;

            // Pontuação
            if (bX < 0) { p2Score++; p2S.innerText = p2Score; reset(); }
            if (bX > 800) { p1Score++; p1S.innerText = p1Score; reset(); }

            // Desenhar tudo
            ctx.clearRect(0, 0, 800, 500);
            ctx.fillStyle = "white";
            ctx.fillRect(10, p1Y, 10, 100); // Jogador
            ctx.fillRect(780, p2Y, 10, 100); // Bot
            ctx.fillRect(bX - 5, bY - 5, 10, 100); // Linha Central (reaproveitando altura para economizar)
            
            // Corrige o desenho da bola apagando o retângulo gigante e desenhando o quadrado certo
            ctx.clearRect(0,0,800,500);
            ctx.fillRect(10, p1Y, 10, 100);
            ctx.fillRect(780, p2Y, 10, 100);
            ctx.fillRect(bX - 6, bY - 6, 12, 12); // Bola

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
