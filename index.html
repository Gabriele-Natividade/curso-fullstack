<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #000; border: 3px solid #fff; display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <h1>Pontos: <span id="score">0</span></h1>
    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const tam = 20, limite = 20;
        
        let cobra = [{x: 10, y: 10}];
        let comida = {x: 15, y: 15};
        let dx = 1, dy = 0, pontos = 0;

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
        });

        function jogo() {
            let cabeca = { x: cobra[0].x + dx, y: cobra[0].y + dy };

            if (cabeca.x < 0 || cabeca.x >= limite || cabeca.y < 0 || cabeca.y >= limite || cobra.some(p => p.x === cabeca.x && p.y === cabeca.y)) {
                cobra = [{x: 10, y: 10}];
                dx = 1; dy = 0; pontos = 0;
                document.getElementById("score").innerText = pontos;
                return;
            }

            cobra.unshift(cabeca);

            if (cabeca.x === comida.x && cabeca.y === comida.y) {
                pontos++;
                document.getElementById("score").innerText = pontos;
                comida = { x: Math.floor(Math.random() * limite), y: Math.floor(Math.random() * limite) };
            } else {
                cobra.pop();
            }

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(comida.x * tam, comida.y * tam, tam - 2, tam - 2);

            ctx.fillStyle = "lime";
            cobra.forEach(p => ctx.fillRect(p.x * tam, p.y * tam, tam - 2, tam - 2));
        }

        setInterval(jogo, 100);
    </script>
</body>
</html>
