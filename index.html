<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0ea5e9;
        }

        .message {
            margin-top: 1.5rem;
            font-weight: 600;
            min-height: 24px;
        }

        .hint {
            color: #fbbf24;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .attempts {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .restart-btn {
            background: #4ade80;
            display: none;
        }

        .restart-btn:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Adivinhe o Número</h1>
        <p>Tente adivinhar o número secreto entre 1 e 100.</p>

        <div class="input-area">
            <input type="number" id="guessInput" min="1" max="100" placeholder="Digite seu palpite">
            <button id="submitBtn">Enviar Palpite</button>
            <button id="restartBtn" class="restart-btn">Jogar Novamente</button>
        </div>

        <div id="message" class="message"></div>
        <div id="attempts" class="attempts"></div>
    </div>

    <script>
        let secretNumber;
        let attemptsLeft;
        const maxAttempts = 10;

        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const restartBtn = document.getElementById('restartBtn');
        const messageDisplay = document.getElementById('message');
        const attemptsDisplay = document.getElementById('attempts');

        function initGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attemptsLeft = maxAttempts;
            
            guessInput.value = '';
            guessInput.disabled = false;
            submitBtn.style.display = 'block';
            restartBtn.style.display = 'none';
            
            messageDisplay.textContent = '';
            messageDisplay.className = 'message';
            updateAttemptsDisplay();
        }

        function updateAttemptsDisplay() {
            attemptsDisplay.textContent = `Tentativas restantes: ${attemptsLeft}`;
        }

        function checkGuess() {
            const userGuess = parseInt(guessInput.value);

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                messageDisplay.textContent = 'Por favor, insira um número válido entre 1 e 100.';
                messageDisplay.className = 'message error';
                return;
            }

            attemptsLeft--;

            if (userGuess === secretNumber) {
                messageDisplay.textContent = `Parabéns! Você acertou! O número era ${secretNumber}.`;
                messageDisplay.className = 'message success';
                endGame();
            } else if (attemptsLeft === 0) {
                messageDisplay.textContent = `Fim de jogo! Você esgotou as tentativas. O número era ${secretNumber}.`;
                messageDisplay.className = 'message error';
                endGame();
            } else {
                if (userGuess < secretNumber) {
                    messageDisplay.textContent = 'Muito baixo! Tente um número maior.';
                } else {
                    messageDisplay.textContent = 'Muito alto! Tente um número menor.';
                }
                messageDisplay.className = 'message hint';
                updateAttemptsDisplay();
            }

            guessInput.value = '';
            guessInput.focus();
        }

        function endGame() {
            guessInput.disabled = true;
            submitBtn.style.display = 'none';
            restartBtn.style.display = 'block';
            attemptsDisplay.textContent = '';
        }

        submitBtn.addEventListener('click', checkGuess);
        
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        restartBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
