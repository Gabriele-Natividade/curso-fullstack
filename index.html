<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 50px;
        }
        canvas {
            background-color: #34495e;
            border: 3px solid #ecf0f1;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #pontuacao {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f1c40f;
        }
        p {
            color: #bdc3c7;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>
    <div id="pontuacao">Pontuação: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Use as <b>setas do teclado</b> para jogar.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const tamanhoGrid = 20;
        let cobrinha = [{ x: 160, y: 160 }];
        let dx = tamanhoGrid;
        let dy = 0;
        let comidaX;
        let comidaY;
        let pontuacao = 0;
        let jogoRodando = true;

        function gerarComida() {
            comidaX = Math.floor(Math.random() * (canvas.width / tamanhoGrid)) * tamanhoGrid;
            comidaY = Math.floor(Math.random() * (canvas.height / tamanhoGrid)) * tamanhoGrid;
        }

        function desenharComida() {
            ctx.fillStyle = "#e74c3c"; // Cor da maçã
            ctx.beginPath();
            ctx.arc(comidaX + tamanhoGrid/2, comidaY + tamanhoGrid/2, tamanhoGrid/2.5, 0, 2 * Math.PI);
            ctx.fill();
        }

        function desenharCobrinha() {
            ctx.fillStyle = "#2ecc71"; // Cor da cobra
            ctx.strokeStyle = "#27ae60"; // Borda da cobra
            cobrinha.forEach(parte => {
                ctx.fillRect(parte.x, parte.y, tamanhoGrid, tamanhoGrid);
                ctx.strokeRect(parte.x, parte.y, tamanhoGrid, tamanhoGrid);
            });
        }

        function moverCobrinha() {
            const cabeca = { x: cobrinha[0].x + dx, y: cobrinha[0].y + dy };
            cobrinha.unshift(cabeca); // Adiciona nova cabeça

            // Verifica se comeu a comida
            if (cabeca.x === comidaX && cabeca.y === comidaY) {
                pontuacao += 10;
                document.getElementById("pontuacao").innerText = `Pontuação: ${pontuacao}`;
                gerarComida();
            } else {
                cobrinha.pop(); // Remove a cauda se não comeu
            }
        }

        function verificarColisao() {
            const cabeca = cobrinha[0];
            
            // Bateu nas paredes
            if (cabeca.x < 0 || cabeca.x >= canvas.width || cabeca.y < 0 || cabeca.y >= canvas.height) {
                jogoRodando = false;
            }

            // Bateu no próprio corpo
            for (let i = 1; i < cobrinha.length; i++) {
                if (cabeca.x === cobrinha[i].x && cabeca.y === cobrinha[i].y) {
                    jogoRodando = false;
                }
            }
        }

        function mudarDirecao(evento) {
            const TECLA_ESQUERDA = 37;
            const TECLA_DIREITA = 39;
            const TECLA_CIMA = 38;
            const TECLA_BAIXO = 40;

            const teclaPressionada = evento.keyCode;
            const indoCima = dy === -tamanhoGrid;
            const indoBaixo = dy === tamanhoGrid;
            const indoDireita = dx === tamanhoGrid;
            const indoEsquerda = dx === -tamanhoGrid;

            // Impede que a cobra dê "marcha ré" em si mesma
            if (teclaPressionada === TECLA_ESQUERDA && !indoDireita) {
                dx = -tamanhoGrid;
                dy = 0;
            }
            if (teclaPressionada === TECLA_CIMA && !indoBaixo) {
                dx = 0;
                dy = -tamanhoGrid;
            }
            if (teclaPressionada === TECLA_DIREITA && !indoEsquerda) {
                dx = tamanhoGrid;
                dy = 0;
            }
            if (teclaPressionada === TECLA_BAIXO && !indoCima) {
                dx = 0;
                dy = tamanhoGrid;
            }
        }

        function atualizarJogo() {
            if (!jogoRodando) {
                ctx.fillStyle = "white";
                ctx.font = "bold 35px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Fim de Jogo!", canvas.width / 2, canvas.height / 2);
                ctx.font = "20px sans-serif";
                ctx.fillText("Recarregue a página para tentar de novo", canvas.width / 2, (canvas.height / 2) + 30);
                return;
            }

            setTimeout(function onTick() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                desenharComida();
                moverCobrinha();
                verificarColisao();
                desenharCobrinha();
                atualizarJogo(); 
            }, 100); 
        }

        
        document.addEventListener("keydown", mudarDirecao);
        gerarComida();
        atualizarJogo();
    </script>
</body>
</html>
