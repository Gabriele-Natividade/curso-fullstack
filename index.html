<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | Simples</title>
<style>
    /* CSS super básico e direto */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #333;
    }

    header {
        display: flex;
        justify-content: space-between;
        padding: 1.5rem 2rem;
        background-color: #f4f4f4;
        border-bottom: 1px solid #ddd;
    }

    nav a {
        margin-left: 15px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }

    .hero {
        text-align: center;
        padding: 5rem 2rem;
        background-color: #eaeaea;
    }

    .btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #111;
        color: #fff;
        text-decoration: none;
        margin-top: 15px;
        border-radius: 3px;
    }

    .produtos {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 4rem 2rem;
    }

    .card {
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
        width: 250px;
        border-radius: 5px;
    }

    footer {
        text-align: center;
        padding: 2rem;
        background-color: #f4f4f4;
        border-top: 1px solid #ddd;
    }
</style>
</head>
<body>

    <header>
        <strong>AURA</strong>
        <nav>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Moda Minimalista</h1>
        <p>Roupas simples, elegantes e direto ao ponto.</p>
        <a href="#produtos" class="btn">Ver Coleção</a>
    </section>

    <section id="produtos" class="produtos">
        <div class="card">
            <h3>Camisa Básica</h3>
            <p>R$ 120,00</p>
            <a href="#" class="btn">Comprar</a>
        </div>

        <div class="card">
            <h3>Calça Simples</h3>
            <p>R$ 180,00</p>
            <a href="#" class="btn">Comprar</a>
        </div>
    </section>

    <footer id="contato">
        <p>Fale conosco: contato@aura.com.br</p>
        <p>&copy; 2026 Aura. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
