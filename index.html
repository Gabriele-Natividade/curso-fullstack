<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4caf50;
        }

        button {
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none; /* Escondido até o cálculo */
        }

        /* Cores dinâmicas para o resultado */
        .normal { background-color: #e8f5e9; color: #2e7d32; }
        .alerta { background-color: #fff3e0; color: #ef6c00; }
        .perigo { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de IMC</h2>
        
        <!-- Removido a action padrão do form para tratar com JS -->
        <form id="imcForm">
            <div class="input-group">
                <label for="peso">Peso (kg):</label>
                <input 
                    type="number" 
                    id="peso" 
                    placeholder="Exemplo: 65" 
                    step="0.1" 
                    required
                > 
            </div>
            
            <div class="input-group">
                <label for="altura">Altura (m):</label>
                <input 
                    type="number" 
                    id="altura" 
                    placeholder="Exemplo: 1.70" 
                    step="0.01" 
                    required
                > 
            </div>

            <button type="submit">Calcular IMC</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('imcForm').addEventListener('submit', function(event) {
            // Evita que a página recarregue ao submeter o formulário
            event.preventDefault(); 

            // Captura os valores e converte para float
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const resultadoDiv = document.getElementById('resultado');

            // Validação simples de segurança
            if (!peso || !altura || altura <= 0) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.className = 'perigo';
                resultadoDiv.innerHTML = 'Por favor, insira valores válidos.';
                return;
            }

            // Cálculo do IMC
            const imc = (peso / (altura * altura)).toFixed(1);
            let classificacao = '';
            let classeCss = '';

            // Tabela de classificação do IMC
            if (imc < 18.5) {
                classificacao = 'Abaixo do peso';
                classeCss = 'alerta';
            } else if (imc >= 18.5 && imc <= 24.9) {
                classificacao = 'Peso normal';
                classeCss = 'normal';
            } else if (imc >= 25 && imc <= 29.9) {
                classificacao = 'Sobrepeso';
                classeCss = 'alerta';
            } else if (imc >= 30 && imc <= 34.9) {
                classificacao = 'Obesidade Grau I';
                classeCss = 'perigo';
            } else if (imc >= 35 && imc <= 39.9) {
                classificacao = 'Obesidade Grau II';
                classeCss = 'perigo';
            } else {
                classificacao = 'Obesidade Grau III';
                classeCss = 'perigo';
            }

            //funcionando perfeitamente
            // Exibe o resultado na tela mudando a classe CSS dinamicamente
            resultadoDiv.style.display = 'block';
            resultadoDiv.className = classeCss;
            resultadoDiv.innerHTML = `Seu IMC é ${imc} (${classificacao})`;
        });
    </script>

</body>
</html>
