<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gorjeta</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            padding: 40px;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dividir Conta</h2>
        
        <form id="gorjetaForm">
            <div class="input-group">
                <label for="totalConta">Total da Conta (R$):</label>
                <input type="number" id="totalConta" step="0.01" required> 
            </div>
            
            <div class="input-group">
                <label for="qualidadeServico">Qualidade do Serviço:</label>
                <select id="qualidadeServico" required>
                    <option value="0.10">Excelente (10%)</option>
                    <option value="0.15">Excepcional (15%)</option>
                    <option value="0.05">Regular (5%)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="numPessoas">Número de Pessoas:</label>
                <input type="number" id="numPessoas" min="1" value="1" required> 
            </div>

            <button type="submit">Calcular Total</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('gorjetaForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const totalConta = parseFloat(document.getElementById('totalConta').value);
            const taxaGorjeta = parseFloat(document.getElementById('qualidadeServico').value);
            const numPessoas = parseInt(document.getElementById('numPessoas').value);
            const resultadoDiv = document.getElementById('resultado');

            const valorGorjeta = totalConta * taxaGorjeta;
            const valorTotal = totalConta + valorGorjeta;
            const valorPorPessoa = (valorTotal / numPessoas).toFixed(2);

            resultadoDiv.innerHTML = `Gorjeta: R$ ${valorGorjeta.toFixed(2)}<br>Total por Pessoa: R$ ${valorPorPessoa}`;
        });
    </script>

</body>
</html>
