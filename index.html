<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Dado Moderno</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte mais moderna */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f2f5; /* Fundo ligeiramente mais suave */
        }
        
        .card { 
            text-align: center; 
            padding: 35px 25px; 
            background: white; 
            border-radius: 16px; /* Bordas mais arredondadas */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Sombra mais suave e elegante */
            width: 300px;
        }
        
        h1 { 
            font-size: 1.3rem; 
            color: #6b7280; /* Texto cinza intermediário */
            margin-bottom: 20px; 
            letter-spacing: 0.5px;
        }
        
        .display { 
            font-size: 5rem; /* Um pouco maior para dar destaque */
            margin-bottom: 25px; 
            font-weight: 800; 
            color: #4f46e5; /* Cor inicial roxa/indigo */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animação com efeito "bouncy" */
        }
        
        button { 
            width: 100%;
            padding: 14px; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            color: white; 
            border-radius: 8px; 
            background-color: #4f46e5; /* Combinando com o tema roxo */
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #4338ca;
            transform: translateY(-1px); /* Sobe de leve no hover */
        }

        button:active {
            transform: translateY(1px); /* Efeito de clique real */
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Lançar Dado</h1>
        <div id="display" class="display">⚀</div> 
        <button onclick="sortear()">Jogar Dado</button>
    </div>

    <script>
        const display = document.getElementById('display');

        function sortear() {
            display.style.transform = 'scale(0.7) rotate(-15deg)';
            
            setTimeout(() => {
                const numeroSorteado = Math.floor(Math.random() * 6) + 1;
                
                display.textContent = numeroSorteado;
                // Volta ao tamanho normal, cresce um pouquinho e gira 15 graus para o outro lado
                display.style.transform = 'scale(1.05) rotate(15deg)';
                
                // Cores personalizadas baseadas no resultado
                if (numeroSorteado === 6) {
                    display.style.color = '#10b981'; /* Verde para a sorte grande */
                } else if (numeroSorteado === 1) {
                    display.style.color = '#f43f5e'; /* Rosa/Vermelho para o azar do 1 */
                } else {
                    display.style.color = '#4f46e5'; /* Roxo padrão para os outros números */
                }
            }, 150);
        }
    </script>
</body>
</html>
